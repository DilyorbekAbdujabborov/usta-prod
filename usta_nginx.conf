upstream usta_django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location /static/ {
        alias /root/usta_prod/usta-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /root/usta_prod/usta-backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # proxy_params already sets Host, X-Real-IP, X-Forwarded-For and
    # X-Forwarded-Proto. Repeating any of them here does not override the
    # include - nginx sends the header twice, and Django joins the two values
    # with a comma, so HTTP_HOST arrives as "example.com,example.com" and
    # every request dies with DisallowedHost.
    location /api/ {
        include proxy_params;
        proxy_pass http://usta_django;
        proxy_redirect off;
    }

    location /admin/ {
        include proxy_params;
        proxy_pass http://usta_django;
        proxy_redirect off;
    }

    # Served by Django (core/urls.py), not present in the SPA build, so without
    # this the try_files below answers it with index.html. Exact match on
    # purpose: a prefix match on /.well-known/ would swallow certbot's
    # acme-challenge requests.
    location = /.well-known/web-app-origin-association {
        include proxy_params;
        proxy_pass http://usta_django;
    }

    location / {
        root /root/usta_prod/ustalaruz/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
