<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usta — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(29, 78, 216, 0.12);
    }
    .icon svg {
      width: 40px;
      height: 40px;
      color: #1d4ed8;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 24px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #dc2626;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    button {
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 16px rgba(29, 78, 216, 0.2);
    }
    button:hover {
      background: #1e40af;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(29, 78, 216, 0.3);
    }
    button:active {
      transform: scale(0.98);
    }
    .footer {
      position: fixed;
      bottom: 20px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
    </svg>
  </div>
  <h1>Usta</h1>
  <div class="status">
    <span class="dot"></span>
    Internetga ulanish yo'q
  </div>
  <p>Hozircha offline rejimdasiz. Internetga ulanib, qayta urinib ko'ring.</p>
  <button onclick="location.reload()">Qayta urinish</button>
  <div class="footer">Usta — Professional ustalar platformasi</div>
</body>
</html>
